<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS2 heatmap statistic</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-layout">
      
      <header class="app-header">
        <h1>CS2 heatmap statistic</h1>
      </header>

      <div class="main-content">
        
        <aside class="sidebar">
          <div id="drop-zone" class="drop-zone">
            <h2 id="drop-title">drag .dem here</h2>
          </div>

          <div class="control-panel">
            <h3>Data Filter</h3>
            <div class="filter-group">
              <label><input type="checkbox" checked id="filter-kills"> Deaths</label>
              <label><input type="checkbox" id="filter-smokes"> Smoke</label>
              <label><input type="checkbox" id="filter-molotovs"> Molotov</label>
              <label><input type="checkbox" id="filter-flashes"> Flashbang</label>
              <label><input type="checkbox" id="filter-grenades"> HE Grenade</label>
            </div>
          </div>
        </aside>

        <main class="map-area">
          <div id="map-container" class="hidden">
            <canvas id="heatmap-canvas" width="1024" height="1024"></canvas>
          </div>
        </main>

      </div>
    </div>
    
    <script type="module" src="./main.js"></script>
  </body>
</html>
